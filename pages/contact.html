<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | myteam</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <main>
        <section class="contact-section" aria-labelledby="contact-title">
            <img class="contact-decoration-left" src="../assets/icons/bg-pattern-about-2-contact-1.svg" alt="">
            <img class="contact-decoration-right" src="../assets/icons/bg-pattern-contact-2.svg" alt="">

            <div class="contact-content">
                <div class="contact-information">
                    <h1 id="contact-title">Contact</h1>
                    <h2>Ask us about</h2>

                    <ul class="contact-features">
                        <li>
                            <img src="../assets/icons/icon-person.svg" alt="">
                            <p>The quality of our talent network</p>
                        </li>
                        <li>
                            <img src="../assets/icons/icon-cog.svg" alt="">
                            <p>Usage &amp; implementation of our software</p>
                        </li>
                        <li>
                            <img src="../assets/icons/icon-chart.svg" alt="">
                            <p>How we help drive innovation</p>
                        </li>
                    </ul>
                </div>

                <form class="contact-form">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" autocomplete="name" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email Address</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>

                    <div class="form-field">
                        <label for="company-name">Company Name</label>
                        <input id="company-name" name="company-name" type="text" autocomplete="organization" required>
                    </div>

                    <div class="form-field">
                        <label for="title">Title</label>
                        <input id="title" name="title" type="text" autocomplete="organization-title" required>
                    </div>

                    <div class="form-field form-field-message">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="2" required></textarea>
                    </div>

                    <button type="submit">submit</button>
                </form>
                    </div>
        </section>
    </main>
</body>
</html>

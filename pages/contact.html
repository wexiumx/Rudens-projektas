<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <header>
        <section class="header-navigation-bar">
            <aside>
                <img src="../assets/icons/logo.svg" alt="logo">
                <nav>
                    <a href="../index.html">home</a>
                    <a href="about.html">about</a>
                </nav>
            </aside> 

            <aside>
                <button><a href="contact.html">contact us</a></button>
            </aside> 
        </section>

    </header>
    <main>
        <section class="contact-section" aria-labelledby="contact-title">
            <img class="contact-decoration-left" src="../assets/icons/bg-pattern-about-2-contact-1.svg" alt="">
            <img class="contact-decoration-right" src="../assets/icons/bg-pattern-contact-2.svg" alt="">

            <div class="contact-content">
                <div class="contact-information">
                    <h1 id="contact-title">Contact</h1>
                    <h2>Ask us about</h2>

                    <ul class="contact-features">
                        <li>
                            <img src="../assets/icons/icon-person.svg" alt="">
                            <p>The quality of our talent network</p>
                        </li>
                        <li>
                            <img src="../assets/icons/icon-cog.svg" alt="">
                            <p>Usage &amp; implementation of our software</p>
                        </li>
                        <li>
                            <img src="../assets/icons/icon-chart.svg" alt="">
                            <p>How we help drive innovation</p>
                        </li>
                    </ul>
                </div>

                <form class="contact-form">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" autocomplete="name" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email Address</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>

                    <div class="form-field">
                        <label for="company-name">Company Name</label>
                        <input id="company-name" name="company-name" type="text" autocomplete="organization" required>
                    </div>

                    <div class="form-field">
                        <label for="title">Title</label>
                        <input id="title" name="title" type="text" autocomplete="organization-title" required>
                    </div>

                    <div class="form-field form-field-message">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="2" required></textarea>
                    </div>

                    <button type="submit">submit</button>
                </form>
                    </div>
        </section>
    </main>

     <footer class="site-footer">

    <div class="footer-content">

        <div class="footer-left">

            <div>

            <img class="footer-logo" src="../assets/icons/logo.svg" alt="myteam logo">

            <nav class="footer-nav">
                <a href="../index.html">home</a>
                <a href="../pages/about.html">about</a>
            </nav>

            </div>

            <div class="footer-address-box">
            <address class="footer-address">
            
            <p>987 Hillcrest Lane</p>
            <p>Irvine, CA</p>
            <p>California 92714</p>
            <p>Call Us : 949-833-7432</p>
            </div>

        </address>

        </div>

        

        <div class="footer-right">

            <div class="footer-socials">
                <a href="#" aria-label="Facebook"><img src="../assets/icons/icon-facebook.svg" alt="facebook"></a>
                <a href="#" aria-label="Pinterest"><img src="../assets/icons/icon-pinterest.svg" alt="Pinterest"></a>
                <a href="#" aria-label="Twitter"><img src="../assets/icons/icon-twitter.svg" alt="Twitter"></a>
            </div>

            <p class="footer-copyright">
                Copyright 2020. All Rights Reserved
            </p>

        </div>

    </div>

</footer>

</body>
</html>
